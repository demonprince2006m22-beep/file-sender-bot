services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_file_sender_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persistent SQLite volume
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

